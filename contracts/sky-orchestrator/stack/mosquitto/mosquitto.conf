# The stack's broker: the Cloud API surface and the internal bus on one
# instance, separated by topic ACLs (ADR-0003). Read by the entrypoint's
# mosquitto from this read-only mount; the password and ACL files it names are
# written to a tmpfs at start, never to the repository or the data volume.

per_listener_settings false

# Small MQTT packets go at once: with Nagle's algorithm on, a reply waited out the
# client's delayed ACK, 40 ms a stall (found by the Sky Orchestrator Client, 2026-10-10).
set_tcp_nodelay true

# Inside the container only. The host publishes this port on SO_BIND, which
# defaults to loopback (NFR-SEC-01).
listener 1883
protocol mqtt

# NFR-SEC-02: no anonymous clients, one credential per client, topic ACLs.
allow_anonymous false
password_file /run/mosquitto/passwd
acl_file /run/mosquitto/acl

# FR-DEV-06: a credential is one client. The username is the client identifier,
# so a second connection on the same credential takes the session over and the
# first is disconnected, as MQTT specifies for a repeated identifier, whatever
# identifier the client asked for.
use_username_as_clientid true

# ADR-0013: Mosquitto ships with persistence off. Without it a persistent
# session, and the QoS 1 messages queued for it, vanish on a broker restart.
persistence true
persistence_location /mosquitto/data/
# Written on a clean shutdown, and every minute in case there is none.
autosave_interval 60

# Logs go to the container's output and to $SYS/broker/log/<level>, where
# so-gateway reads the takeover FR-DEV-06 must not keep silent.
log_dest stdout
log_dest topic
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

sys_interval 10
