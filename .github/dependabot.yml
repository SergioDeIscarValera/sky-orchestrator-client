version: 2
updates:
  # "ci" is a type and the workflows belong to the repository (ADR-0003).
  # tools/tests/test_lint_commits.py holds every prefix here to the linter.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(repo)"
    open-pull-requests-limit: 5

  # The Python workspace: one lockfile for every Python unit (ADR-0017).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(repo)"
    open-pull-requests-limit: 5

  # The base images of every image, pinned by digest (NFR-SEC-08).
  - package-ecosystem: docker
    directories:
      - /services/soc-cloud
      - /services/soc-operations
      - /infra/migrate
      - /apps/soc-web
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(repo)"
    open-pull-requests-limit: 5
    # Python, Node and nginx stay on the lines ADR-0016 and ADR-0017 chose until
    # a record moves them: Python 3.14, Node's LTS, nginx's stable (even) minor.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The web: one lockfile, pinned versions (ADR-0016).
  - package-ecosystem: npm
    directory: /apps/soc-web
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(web)"
    open-pull-requests-limit: 5
    # Node's types follow the runtime's major, Node 24 until ADR-0016 moves it.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Each unit's ecosystem joins this file with its manifest. Versions are pinned
  # on purpose (NFR-PORT-02): Dependabot proposes, review decides.
