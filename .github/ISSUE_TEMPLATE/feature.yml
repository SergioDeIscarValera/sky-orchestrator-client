name: Work item
description: A requirement to implement or a change to propose
labels: [enhancement]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement
      description: The requirement this delivers. If none exists, say so; it may need one first.
      placeholder: FR-GEO-03
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: M3
    validations:
      required: true

  - type: input
    id: unit
    attributes:
      label: Unit
      placeholder: soc-web
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Measurable outcome
      description: What gets measurably better, and how will it be seen (NFR-OBS-03)?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Falsifiable statements a test can assert.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Can this command an aircraft, or change what the operator sees of one? If yes, enumerate the failure modes.
    validations:
      required: true
