name: Release

# Tags and publishes a release when a release or hotfix pull request merges into
# main. The version is the one the branch declared, verified again here before
# the tag exists. Then it publishes the service images at that tag, opens the
# back-merge into develop and deploys the tag on the mini-PC (FR-DEP-06). See
# docs/github-governance.md and ADR-0026.
#
# Run by hand (workflow_dispatch) with an existing tag, it only deploys that tag
# on the mini-PC: a redeploy, the first install, or a rollback to an older tag.
#
# The deploy job runs only while the repository variable
# SOC_MINIPC_DEPLOY_ENABLED is `true`. Without it the job is skipped, never
# queued: a job for `[self-hosted, minipc]` waits up to 24 h when no such runner
# exists, and timeout-minutes bounds the run, not the queue. Setting it up:
# docs/mini-pc-deployment.md, "Deploying on every release".

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to deploy on the mini-PC, such as v0.5.2"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    name: Tag and publish release
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the version from the branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          version="$(python3 tools/next_version.py --branch "$HEAD_REF")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Tags are never moved." >&2
            exit 1
          fi

      - name: Create the annotated tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION (#$PR_NUMBER)"
          git push origin "$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release create "$VERSION" --repo "$REPO" --title "$VERSION" --generate-notes --verify-tag

  images:
    name: Publish the service images
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      SERVICES: "soc-cloud=services/soc-cloud/Dockerfile soc-operations=services/soc-operations/Dockerfile soc-migrate=infra/migrate/Dockerfile soc-web=apps/soc-web/Dockerfile"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # Image tags are never moved, like git tags: an existing one fails the job.
      - name: Build and push each image at the release tag
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${OWNER,,}/sky-orchestrator-client"
          for entry in $SERVICES; do
            service="${entry%%=*}"
            dockerfile="${entry#*=}"
            image="$registry/$service:$VERSION"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "::error::$image already exists. Image tags are never moved." >&2
              exit 1
            fi
            docker build -f "$dockerfile" -t "$image" \
              --label "org.opencontainers.image.source=https://github.com/$REPO" \
              --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.revision=$REVISION" .
            docker push "$image"
          done

  back_merge:
    name: Open the back-merge into develop
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never from main itself: automatic head-branch deletion would delete main
      # on merge. A throwaway backmerge/vX.Y.Z cut from main is deleted instead.
      - name: Open the back-merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$REPO/compare/develop...main" --jq '.ahead_by')" = "0" ]; then
            echo "develop already contains everything on main."
            exit 0
          fi

          source="backmerge/$VERSION"
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/$REPO/git/ref/heads/$source" >/dev/null 2>&1; then
            echo "$source exists, reusing it."
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$source" -f sha="$main_sha" >/dev/null
          fi

          existing="$(gh pr list --repo "$REPO" --base develop --head "$source" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Back-merge pull request #$existing already open."
            exit 0
          fi

          gh pr create \
            --repo "$REPO" \
            --base develop \
            --head "$source" \
            --title "chore(repo): back-merge $VERSION into develop" \
            --body "Automatic back-merge so develop carries everything released in \`$VERSION\`, including its merge commit. Cut from main as a throwaway branch, deleted on merge. GitHub starts no workflow for a pull request a workflow opens: close and reopen this one to run its checks, then merge it with a merge commit (ADR-0003)."

  deploy:
    name: Deploy on the mini-PC
    needs: [tag, images]
    # Three conditions. The switch: no runner, no deploy (see the header). A
    # release deploys only once its images are published. A dispatch deploys
    # the tag it names, and the tag and images jobs are skipped for it.
    if: >-
      always() && !cancelled() &&
      vars.SOC_MINIPC_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && needs.images.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, minipc]
    # One deploy at a time, and never one cut short: an interrupted `up` leaves
    # the farm's stack in an unknown state.
    concurrency:
      group: soc-minipc-deploy
      cancel-in-progress: false
    # Bounds the run (pull, migrate, up --wait), not the queue.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.tag.outputs.version }}
      # The stack's stable folder, outside the runner's workspace: its env and
      # configuration files are written once on the mini-PC and never by CI.
      STACK_DIR: ${{ vars.SOC_STACK_DIR || '/srv/sky-orchestrator-client/stack' }}
    steps:
      - name: Refuse a version that is not a release tag
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release tag such as v0.5.2." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Check the mini-PC
        run: |
          set -euo pipefail
          docker version >/dev/null || { echo "::error::$(id -un) cannot reach Docker: is it in group docker?" >&2; exit 1; }
          if [[ ! -d "$STACK_DIR" || ! -w "$STACK_DIR" ]]; then
            echo "::error::$STACK_DIR is missing or not writable by $(id -un). Setting it up: docs/mini-pc-deployment.md, Phase 2." >&2
            exit 1
          fi
          problems=()
          # The secrets: the runner's own, and nobody else's to read. deploy.py
          # rewrites SOC_VERSION in .env.
          for file in .env migrate.env soc-cloud.env soc-operations.env soc-web.env; do
            path="$STACK_DIR/$file"
            if [[ ! -f "$path" ]]; then
              problems+=("$file is missing")
            elif [[ ! -O "$path" ]]; then
              problems+=("$file is not owned by $(id -un)")
            elif [[ "$(stat -c %a "$path")" != 600 ]]; then
              problems+=("$file is mode $(stat -c %a "$path"), not 600: it holds secrets")
            fi
          done
          # The configuration names its secrets and holds none; the services read
          # it as uid 10001.
          for file in soc-cloud.json soc-operations.json soc-web.json; do
            path="$STACK_DIR/$file"
            if [[ ! -f "$path" ]]; then
              problems+=("$file is missing")
            elif (( (8#$(stat -c %a "$path") & 4) == 0 )); then
              problems+=("$file is not readable by others: the services run as uid 10001")
            fi
          done
          if (( ${#problems[@]} )); then
            for problem in "${problems[@]}"; do echo "::error::$STACK_DIR: $problem" >&2; done
            echo "::error::Those files are written once on the mini-PC: docs/mini-pc-deployment.md, Phase 2." >&2
            exit 1
          fi

      # The tag's versioned files go to the stable folder; its env and
      # configuration files are never touched.
      - name: Put this tag's compose file and deploy command in place
        run: |
          set -euo pipefail
          install -m 0644 infra/compose/compose.yaml "$STACK_DIR/compose.yaml"
          install -m 0755 infra/deploy/deploy.py "$STACK_DIR/deploy.py"
          install -d -m 0755 "$STACK_DIR/site"

      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Check the configuration files with this tag's soc-config
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/sky-orchestrator-client/soc-cloud:$VERSION"
          for unit in soc-cloud soc-operations soc-web; do
            docker run --rm -v "$STACK_DIR:/etc/soc:ro" --entrypoint soc-config "$image" \
              check "$unit" "/etc/soc/$unit.json"
          done

      # Refuses, changing nothing, while a flight is unfinished (FR-DEP-06):
      # the job fails, and a dispatch of the same tag deploys it once it ends.
      - name: Deploy
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/soc-deploy-$VERSION.log"
          status=0
          python3 "$STACK_DIR/deploy.py" "$VERSION" --compose-dir "$STACK_DIR" 2>&1 | tee "$log" || status=$?
          {
            echo "### SOC $VERSION on the mini-PC (exit $status)"
            echo '```'
            tail -n 40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: The stack after the deploy
        if: always()
        run: docker compose -f "$STACK_DIR/compose.yaml" --project-directory "$STACK_DIR" ps || true

      # The runner lives on: no registry credential stays in its Docker config.
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io || true
