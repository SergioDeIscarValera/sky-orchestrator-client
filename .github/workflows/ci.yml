name: CI

# The gate lane: deterministic, offline, fast (NFR-TEST-01). One job, every check
# a step: GitHub bills each job rounded up to a whole minute, and the minutes are
# shared with Sky Orchestrator and Virtual Origen (CON-09). See docs/ci-cd.md.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # The rulesets require this exact name; renaming it drops the requirement.
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every check runs even when an earlier one failed, so one red run shows
      # every problem. A check is skipped only when its prerequisite failed.

      - name: Relative Markdown links resolve
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/check_links.py .

      - name: Traceability matrix equals the requirements
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/check_traceability.py .

      - name: Sky Orchestrator's vendored contracts are unchanged
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/vendor_sky_orchestrator.py --check

      - name: No file over 512 KB
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          oversized=$(git ls-files -z | xargs -0 -I{} find {} -size +512k -print 2>/dev/null || true)
          if [ -n "$oversized" ]; then
            echo "Files over 512 KB are not allowed in git (NFR-MNT-04):" >&2
            echo "$oversized" >&2
            exit 1
          fi

      - name: Tooling gate tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s tools/tests -v

      - id: uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"

      - id: workspace
        name: Python workspace, locked
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --frozen --all-packages

      - name: Python lint and format
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check

      # Types are checked one unit at a time, as each unit is built and tested
      # on its own; tools at the Python the hooks run them with.
      - name: Tooling types
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: uv run --frozen mypy --python-version 3.12 tools

      - name: Database types
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: uv run --frozen mypy database

      - name: soc-migrate gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy infra/migrate
          uv run --frozen pytest infra/migrate/tests

      - name: soc-config gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-config
          uv run --frozen pytest libs/soc-config/tests

      - name: soc-log gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-log
          uv run --frozen pytest libs/soc-log/tests

      - name: soc-supervision gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-supervision
          uv run --frozen pytest libs/soc-supervision/tests

      - name: soc-db gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-db
          uv run --frozen pytest libs/soc-db/tests -m "not lane"

      - name: soc-realtime gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-realtime
          uv run --frozen pytest libs/soc-realtime/tests -m "not lane"

      - name: soc-cloud gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy services/soc-cloud
          uv run --frozen pytest services/soc-cloud/tests -m "not lane"

      - name: soc-operations gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy services/soc-operations
          uv run --frozen pytest services/soc-operations/tests -m "not lane"

      # The container lane (NFR-TEST-02): Postgres, Realtime and Mosquitto from the
      # production images, so it costs their pulls and about a minute. It runs when
      # a pull request changes what it tests, and on every manual run.
      - id: lane-changes
        name: Detect what the container lane tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_REF" ] || git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -qE '^(database/|infra/migrate/|libs/|services/|contracts/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Container lane against Postgres, Realtime and Mosquitto
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && steps.lane-changes.outputs.changed == 'true' }}
        run: |
          uv run --frozen pytest database/tests
          uv run --frozen pytest libs/soc-db/tests -m lane
          uv run --frozen pytest libs/soc-realtime/tests -m lane
          uv run --frozen pytest services/soc-cloud/tests -m lane
          uv run --frozen pytest services/soc-operations/tests -m lane

      # The binary, not the action: the action needs a licence on organization
      # accounts, and a scan that stops the day the repository moves is no gate.
      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
