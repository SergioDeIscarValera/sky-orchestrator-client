name: CI

# The gate lane: deterministic, offline, fast (NFR-TEST-01). One job, every check
# a step: GitHub bills each job rounded up to a whole minute, and the minutes are
# shared with Sky Orchestrator and Virtual Origen (CON-09). See docs/ci-cd.md.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # The rulesets require this exact name; renaming it drops the requirement.
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every check runs even when an earlier one failed, so one red run shows
      # every problem. A check is skipped only when its prerequisite failed.

      - name: Relative Markdown links resolve
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/check_links.py .

      - name: Traceability matrix equals the requirements
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/check_traceability.py .

      - name: Sky Orchestrator's vendored contracts are unchanged
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 tools/vendor_sky_orchestrator.py --check

      - name: No file over 512 KB
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          set -euo pipefail
          oversized=$(git ls-files -z | xargs -0 -I{} find {} -size +512k -print 2>/dev/null || true)
          if [ -n "$oversized" ]; then
            echo "Files over 512 KB are not allowed in git (NFR-MNT-04):" >&2
            echo "$oversized" >&2
            exit 1
          fi

      - name: Tooling gate tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: python3 -m unittest discover -s tools/tests -v

      - id: uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          # Caches are per ref, so a new pull request never hits, and the save costs about 3 s.
          enable-cache: false

      - id: workspace
        name: Python workspace, locked
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --frozen --all-packages

      - name: Aircraft catalogue valid, sourced and loaded as it is
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: uv run --frozen python tools/catalogue_migration.py --check

      - name: Python lint and format
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check

      # Types are checked one unit at a time, as each unit is built and tested
      # on its own; tools at the Python the hooks run them with.
      - name: Tooling types
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: uv run --frozen mypy --python-version 3.12 tools

      - name: Database types
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: uv run --frozen mypy database

      - name: soc-migrate gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy infra/migrate
          uv run --frozen pytest infra/migrate/tests

      - name: soc-config gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-config
          uv run --frozen pytest libs/soc-config/tests

      - name: soc-log gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-log
          uv run --frozen pytest libs/soc-log/tests

      - name: soc-supervision gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-supervision
          uv run --frozen pytest libs/soc-supervision/tests

      - name: soc-db gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-db
          uv run --frozen pytest libs/soc-db/tests -m "not lane"

      - name: soc-realtime gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-realtime
          uv run --frozen pytest libs/soc-realtime/tests -m "not lane"

      - name: soc-geo gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy libs/soc-geo
          uv run --frozen pytest libs/soc-geo/tests

      - name: soc-site gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy infra/site
          uv run --frozen pytest infra/site/tests

      - name: soc-cloud gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy services/soc-cloud
          uv run --frozen pytest services/soc-cloud/tests -m "not lane"

      - name: soc-operations gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy services/soc-operations
          uv run --frozen pytest services/soc-operations/tests -m "not lane"

      - name: soc-check gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy infra/check
          uv run --frozen pytest infra/check/tests -m "not lane"

      - name: soc-e2e gate
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          uv run --frozen mypy infra/e2e
          uv run --frozen pytest infra/e2e/tests -m "not lane"

      # The container lane (NFR-TEST-02): Postgres, Realtime and Mosquitto from the
      # production images, and SOC's own images built and run, so it costs their
      # pulls and builds, a few minutes. It runs when a pull request changes what it
      # tests, and on every manual run.
      - id: lane-changes
        name: Detect what the container lane tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The changed paths go into a variable, not a pipe: grep -q quits at its first
          # match, and a pipe would then fail git with SIGPIPE, which reads as no match.
          # A manual run has no base to diff against, so the lane runs.
          changed=""
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          fi
          if [ -z "$BASE_REF" ] || grep -qE '^(database/|infra/(check|compose|e2e|migrate)/|libs/|services/|contracts/(broadcast|catalogue|config|events|flight-files|geometry|operations|recordings|results|sky-orchestrator)/|apps/soc-web/(Dockerfile|nginx/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)|\.dockerignore$|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Container lane against Postgres, Realtime and Mosquitto
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && steps.lane-changes.outputs.changed == 'true' }}
        run: |
          uv run --frozen pytest database/tests
          uv run --frozen pytest libs/soc-db/tests -m lane
          uv run --frozen pytest libs/soc-realtime/tests -m lane
          uv run --frozen pytest services/soc-cloud/tests -m lane
          uv run --frozen pytest services/soc-operations/tests -m lane
          uv run --frozen pytest infra/check/tests -m lane

      # The web's gate (ADR-0016): types, lint, format, unit tests, the build and
      # its loading budget, and the search for secrets. Node is installed only when
      # the web changes.
      - id: web-changes
        name: Detect web changes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # As the container lane's detector: the paths go into a variable, not a pipe.
          changed=""
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          fi
          if [ -z "$BASE_REF" ] || grep -qE '^(apps/soc-web/|contracts/(config|broadcast|flight-files|geometry|recordings|site|sky-orchestrator)/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Node serves the web's gate and the console end to end, which runs when either
      # the web or what the lane tests changes.
      - id: node
        if: ${{ !cancelled() && (steps.web-changes.outputs.changed == 'true' || steps.lane-changes.outputs.changed == 'true') }}
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: soc-web gate
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.web-changes.outputs.changed == 'true' }}
        working-directory: apps/soc-web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          # The install stops the step: nothing can run without it. Every check after it
          # runs even when an earlier one failed, and the step fails at the end, naming
          # each check that did.
          failed=()
          run_check() {
            "$@" || failed+=("$*")
          }
          corepack enable
          pnpm install --frozen-lockfile
          run_check pnpm typecheck
          run_check pnpm lint
          run_check pnpm format:check
          run_check pnpm test
          run_check pnpm build
          run_check pnpm budget
          run_check pnpm secrets
          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'soc-web gate: these checks failed:\n' >&2
            printf '  %s\n' "${failed[@]}" >&2
            exit 1
          fi

      # The console end to end (infra/e2e): Virtual Origen's platform behind Kong,
      # soc-cloud, a dock on the broker and the console's own image, worked in the
      # runner's Chrome, with WebGL on SwiftShader as the runner has no GPU. M2's exit
      # criteria, measured: an aircraft announced appears within 2 s and is
      # registered, its telemetry reaches the browser within 150 ms at p95, and a
      # silent dock turns it stale at the threshold.
      - name: Console end to end in Chrome
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && steps.node.outcome == 'success' }}
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          SOC_E2E_SOFTWARE_GL: "1"
        run: |
          set -euo pipefail
          corepack enable
          (cd apps/soc-web && pnpm install --frozen-lockfile)
          uv run --frozen pytest infra/e2e/tests -m lane

      # The binary, not the action: the action needs a licence on organization
      # accounts, and a scan that stops the day the repository moves is no gate.
      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
