[project]
name = "soc-db"
version = "0.1.0"
description = "A service's one direct Postgres connection: supervised, LISTEN then sweep, serialized statements, COPY"
requires-python = ">=3.14,<3.15"
dependencies = ["asyncpg==0.32.0", "soc-log", "soc-supervision"]

[dependency-groups]
test = ["soc-database", "soc-migrate"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-log = { workspace = true }
soc-supervision = { workspace = true }
soc-database = { workspace = true }
soc-migrate = { workspace = true }
