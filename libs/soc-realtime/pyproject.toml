[project]
name = "soc-realtime"
version = "0.1.0"
description = "Realtime Broadcast on private channels from the backend: a supervised Phoenix socket, the HTTP batch fallback"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp==3.14.4",
  "msgspec==0.22.0",
  "soc-log",
  "soc-supervision",
  "websockets==17.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-log = { workspace = true }
soc-supervision = { workspace = true }
