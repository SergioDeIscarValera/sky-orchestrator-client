# Gate-lane checks: deterministic, offline, fast (NFR-TEST-01). CI runs the same
# scripts, so a rule cannot drift between a machine and the pipeline.
#
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
#
# Never bypass with --no-verify. A failing hook is a real problem.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  # The scanner and version CI runs, on what is staged: a secret caught here never
  # reaches a pushed history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: commit-message
        name: commit message follows ADR-0003
        entry: python3 tools/lint_commits.py --file
        language: system
        stages: [commit-msg]

      - id: branch-name
        name: branch name follows ADR-0003
        entry: bash -c 'b=$(git rev-parse --abbrev-ref HEAD); [ "$b" = HEAD ] || python3 tools/check_branch.py --branch "$b"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: markdown-links
        name: relative markdown links resolve
        entry: python3 tools/check_links.py
        language: system
        pass_filenames: false
        files: \.md$

      - id: traceability
        name: traceability matrix equals the requirements
        entry: python3 tools/check_traceability.py
        language: system
        pass_filenames: false
        files: ^docs/requirements/

      - id: python-lint
        name: python lint and format
        entry: bash -c 'uv run --frozen ruff check database infra/migrate && uv run --frozen ruff format --check database infra/migrate'
        language: system
        pass_filenames: false
        files: ^(database/|infra/migrate/|pyproject\.toml$)

      - id: python-types
        name: python types
        entry: uv run --frozen mypy database/src database/tests infra/migrate/src infra/migrate/tests
        language: system
        pass_filenames: false
        files: ^(database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: migrate-gate-tests
        name: migration runner gate tests
        entry: uv run --frozen pytest infra/migrate/tests
        language: system
        pass_filenames: false
        files: ^(infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: tools-gate-tests
        name: tools gate tests
        entry: python3 -m unittest discover -s tools/tests
        language: system
        pass_filenames: false
        files: ^(tools/|\.github/|docs/requirements/)
