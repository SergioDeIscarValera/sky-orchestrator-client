# Gate-lane checks: deterministic, offline, fast (NFR-TEST-01). CI runs the same
# scripts, so a rule cannot drift between a machine and the pipeline.
#
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg
#
# Never bypass with --no-verify. A failing hook is a real problem.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.md$|^contracts/sky-orchestrator/)
      - id: end-of-file-fixer
        exclude: ^contracts/sky-orchestrator/
      # pnpm writes its lockfile as several YAML documents and parses it itself
      # (`pnpm install --frozen-lockfile` in CI).
      - id: check-yaml
        exclude: ^apps/soc-web/pnpm-lock\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^contracts/sky-orchestrator/
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  # The scanner and version CI runs, on what is staged: a secret caught here never
  # reaches a pushed history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: commit-message
        name: commit message follows ADR-0003
        entry: python3 tools/lint_commits.py --file
        language: system
        stages: [commit-msg]

      - id: branch-name
        name: branch name follows ADR-0003
        entry: bash -c 'b=$(git rev-parse --abbrev-ref HEAD); [ "$b" = HEAD ] || python3 tools/check_branch.py --branch "$b"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: markdown-links
        name: relative markdown links resolve
        entry: python3 tools/check_links.py
        language: system
        pass_filenames: false
        files: \.md$

      - id: sky-orchestrator-contracts
        name: sky orchestrator's vendored contracts are unchanged
        entry: python3 tools/vendor_sky_orchestrator.py --check
        language: system
        pass_filenames: false
        files: ^(contracts/sky-orchestrator/|tools/vendor_sky_orchestrator\.py$)

      - id: aircraft-catalogue
        name: aircraft catalogue valid, sourced and loaded as it is
        entry: uv run --frozen python tools/catalogue_migration.py --check
        language: system
        pass_filenames: false
        files: ^(contracts/catalogue/|database/migrations/|tools/catalogue_migration\.py$)

      - id: traceability
        name: traceability matrix equals the requirements
        entry: python3 tools/check_traceability.py
        language: system
        pass_filenames: false
        files: ^docs/requirements/

      - id: python-lint
        name: python lint and format
        entry: bash -c 'uv run --frozen ruff check && uv run --frozen ruff format --check'
        language: system
        pass_filenames: false
        files: (\.py|^pyproject\.toml)$

      - id: tools-types
        name: tools types
        entry: uv run --frozen mypy --python-version 3.12 tools
        language: system
        pass_filenames: false
        files: ^(tools/.*\.py|pyproject\.toml)$

      - id: database-types
        name: database types
        entry: uv run --frozen mypy database
        language: system
        pass_filenames: false
        files: ^(database/.*\.py|pyproject\.toml|uv\.lock)$

      - id: soc-migrate-gate
        name: soc-migrate gate
        entry: bash -c 'uv run --frozen mypy infra/migrate && uv run --frozen pytest infra/migrate/tests'
        language: system
        pass_filenames: false
        files: ^(infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: soc-config-gate
        name: soc-config gate
        entry: bash -c 'uv run --frozen mypy libs/soc-config && uv run --frozen pytest libs/soc-config/tests'
        language: system
        pass_filenames: false
        files: ^(libs/soc-config/|contracts/config/|pyproject\.toml$|uv\.lock$)

      - id: soc-log-gate
        name: soc-log gate
        entry: bash -c 'uv run --frozen mypy libs/soc-log && uv run --frozen pytest libs/soc-log/tests'
        language: system
        pass_filenames: false
        files: ^(libs/soc-log/|pyproject\.toml$|uv\.lock$)

      - id: soc-supervision-gate
        name: soc-supervision gate
        entry: bash -c 'uv run --frozen mypy libs/soc-supervision && uv run --frozen pytest libs/soc-supervision/tests'
        language: system
        pass_filenames: false
        files: ^(libs/soc-supervision/|libs/soc-log/|pyproject\.toml$|uv\.lock$)

      - id: soc-db-gate
        name: soc-db gate
        entry: bash -c 'uv run --frozen mypy libs/soc-db && uv run --frozen pytest libs/soc-db/tests -m "not lane"'
        language: system
        pass_filenames: false
        files: ^(libs/soc-db/|libs/soc-supervision/|libs/soc-log/|database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: soc-cloud-gate
        name: soc-cloud gate
        entry: bash -c 'uv run --frozen mypy services/soc-cloud && uv run --frozen pytest services/soc-cloud/tests -m "not lane"'
        language: system
        pass_filenames: false
        files: ^(services/soc-cloud/|libs/|contracts/|database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: soc-operations-gate
        name: soc-operations gate
        entry: bash -c 'uv run --frozen mypy services/soc-operations && uv run --frozen pytest services/soc-operations/tests -m "not lane"'
        language: system
        pass_filenames: false
        # The flight file tests read Sky Orchestrator's WPML subset page, the golden texts and
        # the route example's bake, and the bake's schema; the refusals read the results.
        files: ^(services/soc-operations/|libs/|contracts/(config|flight-files|geometry|results|sky-orchestrator)/|database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: soc-check-gate
        name: soc-check gate
        entry: bash -c 'uv run --frozen mypy infra/check && uv run --frozen pytest infra/check/tests -m "not lane"'
        language: system
        pass_filenames: false
        files: ^(infra/check/|libs/soc-config/|database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: soc-e2e-gate
        name: soc-e2e gate
        entry: bash -c 'uv run --frozen mypy infra/e2e && uv run --frozen pytest infra/e2e/tests -m "not lane"'
        language: system
        pass_filenames: false
        files: ^(infra/(e2e|check|migrate)/|libs/|services/soc-cloud/|database/|contracts/sky-orchestrator/|pyproject\.toml$|uv\.lock$)

      - id: soc-web-gate
        name: soc-web gate
        entry: bash -c 'cd apps/soc-web && pnpm typecheck && pnpm lint && pnpm format:check && pnpm test'
        language: system
        pass_filenames: false
        # The web's tests read these contracts and 0010's raised words, and hold its mirrors equal to them.
        files: ^(apps/soc-web/|contracts/(config|broadcast|events|flight-files|geometry|operations|recordings|results|site|sky-orchestrator)/|database/migrations/)

      - id: soc-geo-gate
        name: soc-geo gate
        entry: bash -c 'uv run --frozen mypy libs/soc-geo && uv run --frozen pytest libs/soc-geo/tests'
        language: system
        pass_filenames: false
        files: ^(libs/soc-geo/|contracts/geometry/|contracts/sky-orchestrator/msdk/|pyproject\.toml$|uv\.lock$)

      - id: soc-site-gate
        name: soc-site gate
        entry: bash -c 'uv run --frozen mypy infra/site && uv run --frozen pytest infra/site/tests'
        language: system
        pass_filenames: false
        files: ^(infra/site/|libs/soc-geo/|contracts/site/|pyproject\.toml$|uv\.lock$)

      - id: soc-realtime-gate
        name: soc-realtime gate
        entry: bash -c 'uv run --frozen mypy libs/soc-realtime && uv run --frozen pytest libs/soc-realtime/tests -m "not lane"'
        language: system
        pass_filenames: false
        files: ^(libs/soc-realtime/|libs/soc-supervision/|libs/soc-log/|database/|infra/migrate/|pyproject\.toml$|uv\.lock$)

      - id: tools-gate-tests
        name: tools gate tests
        entry: python3 -m unittest discover -s tools/tests
        language: system
        pass_filenames: false
        files: ^(tools/|\.github/|docs/requirements/)
