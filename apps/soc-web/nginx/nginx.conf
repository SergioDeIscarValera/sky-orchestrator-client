# soc-web's server (ADR-0015, NFR-SEC-07): the built console, its configuration
# written at start into /tmp/soc-web, and the headers that harden it. The root
# file system is read-only; nginx writes only under /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/javascript application/json text/css;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # add_header in a location drops the server's, so each location includes them.
        location = /config.json {
            alias /tmp/soc-web/config.json;
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /healthz {
            include /tmp/soc-web/headers.conf;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
