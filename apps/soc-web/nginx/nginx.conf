# soc-web's server (ADR-0015, NFR-SEC-07): the built console, its configuration
# written at start into /tmp/soc-web, and the headers that harden it. The root
# file system is read-only; nginx writes only under /tmp. The site models
# (ADR-0018) are mounted read-only at /srv/site, and nginx only reads them.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types application/javascript application/json text/css;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # add_header in a location drops the server's, so each location includes them.
        location = /config.json {
            alias /tmp/soc-web/config.json;
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The site models (ADR-0018): only GET and HEAD, revalidated with their ETag, and
        # a missing file or folder answers 404, never the console. Without its slash,
        # /site is not the models' folder, so it answers 404 too.
        location = /site {
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "no-cache" always;
            return 404;
        }

        location /site/ {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            alias /srv/site/;
            include /tmp/soc-web/headers.conf;
            add_header Allow "GET, HEAD" always;
            add_header Cache-Control "no-cache" always;
            autoindex off;
            charset off;
            default_type application/octet-stream;
            types {
                application/json json;
                application/octet-stream f32;
                image/png png;
            }
            try_files $uri =404;
        }

        location = /healthz {
            include /tmp/soc-web/headers.conf;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            include /tmp/soc-web/headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
