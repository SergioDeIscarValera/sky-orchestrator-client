[project]
name = "soc-site"
version = "0.1.0"
description = "Bakes an organization's site model, terrain and imagery, from IGN once, into the assets the console loads (ADR-0018, FR-DEP-05)"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "pillow==12.3.0", "soc-geo"]

[project.scripts]
soc-site = "soc_site.cli:main"

[tool.uv.sources]
soc-geo = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
