[project]
name = "soc-check"
version = "0.1.0"
description = "SOC's images and stack, built and run as the mini-PC runs them, measured"
requires-python = ">=3.14,<3.15"
dependencies = ["soc-config", "soc-database"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-config = { workspace = true }
soc-database = { workspace = true }
