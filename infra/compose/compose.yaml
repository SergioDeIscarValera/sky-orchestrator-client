# The sky-orchestrator-client compose project on the farm's mini-PC (ADR-0015).
#
#   cp .env.example .env              # the version, the networks, the web's port
#   cp soc-cloud.env.example soc-cloud.env ... and fill the secrets and addresses
#   uv run soc-config example soc-cloud > soc-cloud.json ... and soc-operations,
#   soc-web; fill the blanks
#   docker compose up -d
#
# SOC joins Virtual Origen's and Sky Orchestrator's networks and adds nothing to
# theirs. Only the console publishes a port, on the LAN (ADR-0015); the health
# endpoints answer inside the networks, and the flight files are served on Sky
# Orchestrator's network only (ADR-0008). Every container is read-only,
# unprivileged and limited; the memory limits add up to 512 MB at most
# (NFR-RES-05).

name: sky-orchestrator-client

x-hardened: &hardened
  read_only: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  soc-migrate:
    <<: *hardened
    image: ${SOC_REGISTRY:-ghcr.io/sergiodeiscarvalera/sky-orchestrator-client}/soc-migrate:${SOC_VERSION:?set SOC_VERSION}
    restart: "no"
    env_file: [migrate.env]
    networks: [virtual-origen]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.50"}

  soc-cloud:
    <<: *hardened
    image: ${SOC_REGISTRY:-ghcr.io/sergiodeiscarvalera/sky-orchestrator-client}/soc-cloud:${SOC_VERSION:?set SOC_VERSION}
    depends_on:
      soc-migrate: {condition: service_completed_successfully}
    env_file: [soc-cloud.env]
    environment:
      SOC_CONFIG_FILE: /etc/soc/soc-cloud.json
    volumes:
      - ./soc-cloud.json:/etc/soc/soc-cloud.json:ro
    networks:
      virtual-origen: {}
      sky-orchestrator:
        aliases: [soc-cloud]
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.50"}

  soc-operations:
    <<: *hardened
    image: ${SOC_REGISTRY:-ghcr.io/sergiodeiscarvalera/sky-orchestrator-client}/soc-operations:${SOC_VERSION:?set SOC_VERSION}
    depends_on:
      soc-migrate: {condition: service_completed_successfully}
    env_file: [soc-operations.env]
    environment:
      SOC_CONFIG_FILE: /etc/soc/soc-operations.json
    volumes:
      - ./soc-operations.json:/etc/soc/soc-operations.json:ro
    networks: [virtual-origen]
    deploy:
      resources:
        limits: {memory: 96M, cpus: "0.25"}

  # The browser talks to Supabase itself (ADR-0006), so the web joins no network
  # but its own; its address and public key are written at start (FR-DEP-04).
  # The console's file is checked by soc-config, the contract's one
  # implementation, before the console hands it to browsers (ADR-0023);
  # soc-cloud's image carries soc-config. It reaches no network.
  soc-web-check:
    <<: *hardened
    image: ${SOC_REGISTRY:-ghcr.io/sergiodeiscarvalera/sky-orchestrator-client}/soc-cloud:${SOC_VERSION:?set SOC_VERSION}
    restart: "no"
    entrypoint: ["soc-config", "check", "soc-web", "/etc/soc/soc-web.json"]
    healthcheck: {disable: true}
    network_mode: none
    volumes:
      - ./soc-web.json:/etc/soc/soc-web.json:ro
    deploy:
      resources:
        limits: {memory: 64M, cpus: "0.25"}

  soc-web:
    <<: *hardened
    image: ${SOC_REGISTRY:-ghcr.io/sergiodeiscarvalera/sky-orchestrator-client}/soc-web:${SOC_VERSION:?set SOC_VERSION}
    depends_on:
      soc-web-check: {condition: service_completed_successfully}
    env_file: [soc-web.env]
    environment:
      SOC_CONFIG_FILE: /etc/soc/soc-web.json
    volumes:
      - ./soc-web.json:/etc/soc/soc-web.json:ro
    tmpfs: ["/tmp:size=4m"]
    ports: ["${SOC_WEB_PORT:?set SOC_WEB_PORT}:8080"]
    deploy:
      resources:
        limits: {memory: 32M, cpus: "0.25"}

networks:
  virtual-origen:
    external: true
    name: ${VO2_NETWORK:-supabase-local_default}
  sky-orchestrator:
    external: true
    name: ${SO_NETWORK:-sky-orchestrator_default}
