[project]
name = "soc-database"
version = "0.1.0"
description = "Schema soc's migrations and their tests against an ephemeral Postgres (NFR-TEST-02)"
requires-python = ">=3.14,<3.15"
dependencies = ["asyncpg==0.32.0", "soc-migrate"]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-migrate = { workspace = true }
