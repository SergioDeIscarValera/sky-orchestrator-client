[project]
name = "soc-operations"
version = "0.1.0"
description = "SOC's operations: the lifecycle and its state machine, preflight checks, the simulation gate, flight files"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp==3.14.4",
  "msgspec==0.22.0",
  "soc-config",
  "soc-db",
  "soc-log",
  "soc-supervision",
]

[dependency-groups]
test = ["soc-database", "soc-migrate"]

[project.scripts]
soc-operations = "soc_operations.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-config = { workspace = true }
soc-database = { workspace = true }
soc-db = { workspace = true }
soc-log = { workspace = true }
soc-migrate = { workspace = true }
soc-supervision = { workspace = true }
