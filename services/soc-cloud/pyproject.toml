[project]
name = "soc-cloud"
version = "0.1.0"
description = "SOC's DJI cloud party: one MQTT link per Sky Orchestrator stack, telemetry, commands, flight files"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiohttp==3.14.4",
  "aiomqtt==2.5.1",
  "jsonschema-rs==0.58.6",
  "msgspec==0.22.0",
  "soc-config",
  "soc-db",
  "soc-geo",
  "soc-log",
  "soc-realtime",
  "soc-supervision",
  "websockets==17.2",
]

[dependency-groups]
test = ["soc-database", "soc-migrate"]

[project.scripts]
soc-cloud = "soc_cloud.__main__:main"
soc-broadcast-probe = "soc_cloud.probe:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
soc-config = { workspace = true }
soc-database = { workspace = true }
soc-geo = { workspace = true }
soc-migrate = { workspace = true }
soc-db = { workspace = true }
soc-log = { workspace = true }
soc-realtime = { workspace = true }
soc-supervision = { workspace = true }
